name: esprobe
on: workflow_dispatch
jobs:
  esprobe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Endpoint Security delivery diagnostic
        run: bash lab/esprobe.sh 2>&1 | tee es_diag.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esprobe
          path: |
            es_diag/
            es_diag.log
