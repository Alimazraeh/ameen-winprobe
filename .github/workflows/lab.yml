name: lab
on:
  push:
    paths: ["lab/**", ".github/workflows/lab.yml"]
  workflow_dispatch: {}
jobs:
  lab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rep: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: lab (sensors phase)
        shell: bash
        env:
          LAB_OUT: lab_out
          LAB_PHASE: sensors
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          "$PY" --version
          "$PY" lab/run_lab.py
      - name: lab (Linux strace phase)
        if: runner.os == 'Linux' && matrix.rep == 1
        shell: bash
        env:
          LAB_OUT: lab_out
          LAB_PHASE: trace
        run: |
          sudo apt-get install -y -qq strace git openssh-client
          mkdir -p lab_out
          strace -f -ttt -o lab_out/strace.log -e trace=openat,open,creat,execve,rename,renameat,renameat2,unlink,unlinkat,truncate python3 lab/run_lab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-${{ matrix.os }}-r${{ matrix.rep }}
          path: lab_out/
          retention-days: 3
