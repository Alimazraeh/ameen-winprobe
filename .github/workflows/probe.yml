name: winprobe
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe as runner (default elevated context)
        shell: pwsh
        run: |
          Write-Output "=== CONTEXT A: default runner account ==="
          pwsh -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\winprobe.ps1"
      - name: Probe as a fresh STANDARD (non-admin) user
        shell: pwsh
        run: |
          Write-Output "=== CONTEXT B: standard user via Start-Process -Credential ==="
          $pub = "C:\Users\Public"
          Copy-Item "$env:GITHUB_WORKSPACE\winprobe.ps1" "$pub\winprobe.ps1" -Force
          $plain = "Ameen!" + [guid]::NewGuid().ToString('N').Substring(0,12)
          net user ameenstd $plain /add | Out-Null
          net localgroup Users ameenstd /add 2>$null | Out-Null
          $sec  = ConvertTo-SecureString $plain -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential("ameenstd",$sec)
          Write-Output ("standard user groups: " + (Get-LocalUser ameenstd | ForEach-Object { (Get-LocalGroup | Where-Object { (Get-LocalGroupMember $_.Name -ErrorAction SilentlyContinue).Name -contains "$env:COMPUTERNAME\ameenstd" }).Name -join ',' }))
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          try {
            Start-Process -FilePath $ps `
              -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$pub\winprobe.ps1" `
              -Credential $cred -WorkingDirectory $pub `
              -RedirectStandardOutput "$pub\std_out.txt" -RedirectStandardError "$pub\std_err.txt" -Wait
          } catch { Write-Output ("Start-Process -Credential ERR: " + $_.Exception.Message) }
          Start-Sleep -Seconds 3
          if (Test-Path "$pub\std_out.txt") { Get-Content "$pub\std_out.txt" } else { Write-Output "NO OUTPUT FROM STANDARD USER" }
          if ((Test-Path "$pub\std_err.txt") -and (Get-Item "$pub\std_err.txt").Length -gt 0) { Write-Output "--- stderr ---"; Get-Content "$pub\std_err.txt" }
          net user ameenstd /delete | Out-Null
